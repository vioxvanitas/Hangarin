<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | Hangarin</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1e2b27;
        --muted: #687771;
        --line: #dfe7e2;
        --paper: #f3f6f3;
        --green: #16745a;
        --green-dark: #105541;
        --red: #ad463c;
        --red-soft: #f9e9e6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background:
          radial-gradient(ellipse at 15% 8%, #e2eee7 0, transparent 30rem),
          var(--paper);
        color: var(--ink);
        font-family: "Segoe UI", sans-serif;
      }

      .login-panel {
        width: min(100%, 420px);
        padding: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffffed;
        box-shadow: 0 18px 50px #263b3010;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-weight: 750;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 9px;
        background: var(--green);
        color: white;
        font-family: Georgia, serif;
        font-size: 21px;
      }

      h1 {
        margin: 30px 0 7px;
        font-family: Georgia, serif;
        font-size: 32px;
        font-weight: 500;
      }

      .intro {
        margin: 0 0 25px;
        color: var(--muted);
        font-size: 14px;
      }

      .field {
        margin-top: 17px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 650;
      }

      input {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid #cbd8d1;
        border-radius: 5px;
        background: white;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
      }

      input:focus {
        outline: 2px solid #93c7ae;
        outline-offset: 1px;
      }

      .errorlist {
        margin: 8px 0 0;
        padding: 9px 11px;
        border-radius: 4px;
        background: var(--red-soft);
        color: var(--red);
        font-size: 12px;
        list-style: none;
      }

      .submit-button {
        width: 100%;
        min-height: 44px;
        margin-top: 23px;
        border: 0;
        border-radius: 5px;
        background: var(--green);
        color: white;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: background 160ms ease;
      }

      .submit-button:hover {
        background: var(--green-dark);
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }
        .login-panel {
          padding: 26px 22px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-panel">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span>Hangarin</span>
      </a>
      <h1>Welcome back.</h1>
      <p class="intro">Sign in to continue to your tasks.</p>

      <form method="post">
        {% csrf_token %} {% if form.non_field_errors %}
        <div role="alert">{{ form.non_field_errors }}</div>
        {% endif %} {% if next %}<input
          type="hidden"
          name="next"
          value="{{ next }}"
        />{% endif %}

        <div class="field">
          <label for="{{ form.username.id_for_label }}">Username</label>
          {{ form.username }} {{ form.username.errors }}
        </div>
        <div class="field">
          <label for="{{ form.password.id_for_label }}">Password</label>
          {{ form.password }} {{ form.password.errors }}
        </div>
        <button class="submit-button" type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
